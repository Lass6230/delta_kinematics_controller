name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: src/delta_kinematics_controller

      - name: Checkout kinematics_interface_delta
        uses: actions/checkout@v4
        with:
          repository: Lass6230/kinematics_interface_delta
          path: src/kinematics_interface_delta

      - name: Setup ROS 2 ${{ matrix.ros_distro }}
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep
          sudo rosdep init || true
          rosdep update

      - name: Install ROS dependencies
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --symlink-install --packages-up-to delta_kinematics_controller --event-handlers console_direct+

      - name: Run tests
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source install/setup.bash
          colcon test --packages-select delta_kinematics_controller --event-handlers console_direct+
          colcon test-result --verbose
