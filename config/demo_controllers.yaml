controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    my_delta_controller:
      type: delta_kinematics_controller/DeltaKinematicsController

# Controller-specific configuration
my_delta_controller:
  ros__parameters:
    joints: ["joint1", "joint2", "joint3"]
    lower_joints: ["elbow_pitch_1", "elbow_yaw_1", "elbow_pitch_2", "elbow_yaw_2", "elbow_pitch_3", "elbow_yaw_3"]
    kinematics_plugin_name: "kinematics_interface_delta/DeltaKinematicsPlugin"
    base_link: "base_link"            # Base link name (must match URDF link name)
    ee_link: "ee"                     # End effector link name (must match URDF link name)
    ee_tf_rate: 50.0        # TF publish rate in Hz (EE TF auto-disabled when ee_joints are set)
    # Delta geometry — same values used by MoveIt analytical plugin (kinematics.yaml)
    kinematics_interface_delta:
      e: 0.045
      f: 0.11812
      re: 0.34
      rf: 0.17438
      motor_z_offset: -0.025

joint_state_broadcaster:
  ros__parameters:
    frame_id: base
    joints:
      - joint1
      - joint2
      - joint3
    interfaces:
      - position

joint_trajectory_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
    joints:
      - joint1
      - joint2
      - joint3

