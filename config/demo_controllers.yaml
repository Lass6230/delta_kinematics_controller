controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    my_delta_controller:
      type: delta_kinematics_controller/DeltaKinematicsController

# Controller-specific configuration
my_delta_controller:
  ros__parameters:
    joints: ["joint1", "joint2", "joint3"]
    lower_joints: ["elbow_pitch_1", "elbow_yaw_1", "elbow_pitch_2", "elbow_yaw_2", "elbow_pitch_3", "elbow_yaw_3"]
    kinematics_plugin_name: "kinematics_interface_delta/DeltaKinematicsPlugin"
    base_link: "base"                # Base link name (default: "base")
    ee_link: "end_effector"          # End effector link name (default: "end_effector")
    ee_tf_rate: 50.0        # TF publish rate in Hz (0 disables)
    # configure the underlying kinematics plugin (namespaced under the plugin)
    kinematics_interface_delta:
      e: 0.045
      f: 0.11812
      re: 0.34
      rf: 0.17438
      motor_z_offset: -0.025

joint_state_broadcaster:
  ros__parameters:
    # Only publish the 3 upper arm joints from hardware
    # The lower arm joints are published by my_delta_controller
    frame_id: base  # Match the URDF base link name
    joints:
      - joint1
      - joint2
      - joint3

joint_trajectory_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
    joints:
      - joint1
      - joint2
      - joint3

